server:
  port: 8080

spring:
  application:
    name: ibscn-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ibscn_db}
    username: ${DB_USER:ibscn_user}
    password: ${DB_PASSWORD:ibscn_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true
      "[hibernate.timezone.default_storage]": NORMALIZE

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

  # Timezone da aplicacao
  mvc:
    format:
      date-time: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-min-32-chars-123456}
  refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret-min-32-chars-123456}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias

app:
  timezone: America/Sao_Paulo

logging:
  level:
    br.com.ibscn: INFO
    org.hibernate.SQL: WARN
